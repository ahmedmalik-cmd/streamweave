name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm ci
      - name: Syntax
        run: for f in server.mjs lib/*.mjs scripts/*.mjs public/app.js; do node --check "$f"; done
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
